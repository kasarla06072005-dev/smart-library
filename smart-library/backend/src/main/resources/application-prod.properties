# Activate with: SPRING_PROFILES_ACTIVE=prod
# Never show stack traces or internal error details to clients in production.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false

# ddl-auto stays "update" here for simplicity (no migration tool in this project).
# For a real production deployment, switch to a migration tool (Flyway/Liquibase)
# and set this to "validate" instead.
spring.jpa.hibernate.ddl-auto=update
