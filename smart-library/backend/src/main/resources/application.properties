spring.application.name=library

# --- Database ---
# Overridable via env vars for deployment: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Security ---
# JWT_SECRET: set this to a long random string before deploying (see README_DEPLOYMENT.md)
app.jwt.secret=${JWT_SECRET:INSECURE_DEV_ONLY_CHANGE_ME_0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# first admin account bootstrap (see AdminSeeder) - change ADMIN_PASSWORD before deploying
app.admin.email=${ADMIN_EMAIL:admin@library.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

server.port=${PORT:8080}
